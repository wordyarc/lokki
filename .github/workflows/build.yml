on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
      - id: gradle
        run: ./gradlew build -x :lokki-gradle-plugin:functionalTest --continue

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/reports
        with:
          outcome: ${{ steps.gradle.outcome }}
          name: build

  gradle-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Gradle plugin on ${{ matrix.gradle }} Gradle
    permissions:
      contents: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        gradle:
          - current
          - minimal

    env:
      GRADLE: ${{ matrix.gradle }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
      - name: Cache the TestKit Gradle User Home
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/lokki-gradle-plugin/build/test-kit/caches
          key: test-kit-${{ runner.os }}-${{ matrix.gradle }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'modules/lokki-gradle-plugin/src/**') }}
          restore-keys: test-kit-${{ runner.os }}-${{ matrix.gradle }}-
      - id: gradle
        run: ./gradlew :lokki-gradle-plugin:functionalTest --continue -Plokki.test.gradle="$GRADLE"

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/reports
        with:
          outcome: ${{ steps.gradle.outcome }}
          name: gradle-plugin-${{ matrix.gradle }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
      - id: gradle
        run: ./gradlew -p integration-testing check --continue

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/reports
        with:
          outcome: ${{ steps.gradle.outcome }}
          name: integration

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Kotlin ${{ matrix.kotlin }}
    permissions:
      contents: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - kotlin: '2.4.0'
          - kotlin: '2.4.10'
          - kotlin: '2.4.21'
            compiler-tests: true
          - kotlin: '2.5.0-RC'
            compiler-tests: true

    env:
      KOTLIN: ${{ matrix.kotlin }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
      - id: integration
        run: ./gradlew -p integration-testing test --continue -Plokki.kotlin="$KOTLIN"
      - id: compiler-tests
        if: ${{ !cancelled() && matrix.compiler-tests }}
        run: ./gradlew :compiler-tests:test --continue -Plokki.kotlin="$KOTLIN"

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/reports
        with:
          outcome: ${{ (steps.integration.outcome == 'failure' || steps.compiler-tests.outcome == 'failure') && 'failure' || 'success' }}
          name: kotlin-${{ matrix.kotlin }}
