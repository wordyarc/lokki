on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
      - id: gradle
        run: ./gradlew build -x :lokki-gradle-plugin:functionalTest --continue

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/reports
        with:
          outcome: ${{ steps.gradle.outcome }}
          name: build

  gradle-plugin:
    runs-on: macos-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
      - id: gradle
        run: ./gradlew :lokki-gradle-plugin:functionalTest --continue

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/reports
        with:
          outcome: ${{ steps.gradle.outcome }}
          name: gradle-plugin

  integration:
    runs-on: macos-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
      - id: gradle
        run: ./gradlew -p integration-testing check --continue

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/reports
        with:
          outcome: ${{ steps.gradle.outcome }}
          name: integration

  kotlin:
    runs-on: macos-latest
    name: Kotlin ${{ matrix.kotlin }}
    permissions:
      contents: read
      checks: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - kotlin: '2.4.0'
          - kotlin: '2.4.10'
          - kotlin: '2.4.21'
            compiler-tests: true
          - kotlin: '2.5.0-RC'
            compiler-tests: true

    env:
      KOTLIN: ${{ matrix.kotlin }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
      - id: integration
        run: ./gradlew -p integration-testing check --continue -Plokki.kotlin="$KOTLIN"
      - id: compiler-tests
        if: ${{ !cancelled() && matrix.compiler-tests }}
        run: ./gradlew :compiler-tests:test --continue -Plokki.kotlin="$KOTLIN"

      - if: ${{ !cancelled() }}
        uses: ./.github/actions/reports
        with:
          outcome: ${{ (steps.integration.outcome == 'failure' || steps.compiler-tests.outcome == 'failure') && 'failure' || 'success' }}
          name: kotlin-${{ matrix.kotlin }}
