name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          version=${GITHUB_REF_NAME#v}
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ $version =~ $semver ]] || { echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"; exit 1; }

  check:
    needs: version
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      checks: write

  maven-central:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - run: ./gradlew publishToMavenCentral -Pversion="${GITHUB_REF_NAME#v}" --stacktrace
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_SONATYPE_CLOSE_TIMEOUT_SECONDS: 3600

  gradle-plugin-portal:
    needs: maven-central
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - run: ./gradlew :lokki-gradle-plugin:publishPlugins -Pversion="${GITHUB_REF_NAME#v}" --stacktrace
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  github-release:
    needs: gradle-plugin-portal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          describe=(git describe --tags --abbrev=0 --match 'v*.*.*')
          [[ $GITHUB_REF_NAME == *-* ]] || describe+=(--exclude 'v*-*')
          previous=$("${describe[@]}" "$GITHUB_REF_NAME^" 2>/dev/null || true)
          repository=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          if [[ -n $previous ]]; then
            notes="**Full Changelog**: $repository/compare/$previous...$GITHUB_REF_NAME"
          else
            notes="**Full Changelog**: $repository/commits/$GITHUB_REF_NAME"
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag \
            --prerelease="$PRERELEASE"
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}

  release-branch:
    needs: gradle-plugin-portal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/release/${GITHUB_REF_NAME#v}" -f sha="$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
