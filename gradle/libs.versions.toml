[versions]
# -- JVM compatibility --------------------------------------------------------
jvm-toolchain = "25"
jvm-target = "17"

# -- Gradle compatibility -----------------------------------------------------
gradle-min-version = "9.0.0"
gradle-min-kotlin = "2.2"
agp-min = "8.13.2"
agp-latest = "9.4.1"

# -- Dependencies -------------------------------------------------------------
kotlin = "2.4.20"
junit = "4.13.2"
junit-jupiter = "5.14.4"
jupiter-min = "5.12.2"
jupiter6 = "6.1.3"
jupiter-unsupported = "5.10.1"
kotlinx-coroutines = "1.11.0"
buildconfig = "5.6.5"
maven-publish = "0.37.0"
plugin-publish = "2.2.1"
asm = "9.10.1"

[libraries]
# -- Plugin APIs --------------------------------------------------------------
kotlin-compiler = { group = "org.jetbrains.kotlin", name = "kotlin-compiler", version.ref = "kotlin" }
kotlin-gradle-plugin-api = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin-api", version.ref = "kotlin" }
kotlin-tooling-core = { group = "org.jetbrains.kotlin", name = "kotlin-tooling-core", version.ref = "kotlin" }

# -- JUnit integration --------------------------------------------------------
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "jupiter-min" }

# -- Test infrastructure ------------------------------------------------------
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
kotlin-test-framework = { group = "org.jetbrains.kotlin", name = "kotlin-compiler-internal-test-framework", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-jupiter" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
junit-platform-testkit = { module = "org.junit.platform:junit-platform-testkit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# -- Compiler test libraries --------------------------------------------------
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-stdlib-jdk8 = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-script-runtime = { group = "org.jetbrains.kotlin", name = "kotlin-script-runtime", version.ref = "kotlin" }
kotlin-annotations-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-annotations-jvm", version.ref = "kotlin" }

# -- Build logic --------------------------------------------------------------
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
buildconfig-gradle-plugin = { module = "com.github.gmazzo.buildconfig:plugin", version.ref = "buildconfig" }
maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish" }
plugin-publish-gradle-plugin = { module = "com.gradle.publish:plugin-publish-plugin", version.ref = "plugin-publish" }

[bundles]
kotlin-compiler-test-libraries = [
    "kotlin-stdlib",
    "kotlin-stdlib-jdk8",
    "kotlin-reflect",
    "kotlin-test",
    "kotlin-script-runtime",
    "kotlin-annotations-jvm",
]
